<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo MULTIMATERIALES</title>
</head>
<body>
<div style="font-family:Arial,sans-serif;padding:30px;text-align:center">Cargando catálogo MULTIMATERIALES…</div>
<script>
(async()=>{
  try{
    const parts=Array.from({length:12},(_,i)=>`catalogo_payload_${String(i+1).padStart(2,'0')}.txt`);
    const texts=await Promise.all(parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar '+p);return r.text();})));
    const b64=texts.join('');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window))throw new Error('Este navegador no soporta la carga del catálogo.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:Arial,sans-serif;max-width:700px;margin:60px auto;padding:24px;color:#111"><h2>No se pudo cargar el catálogo</h2><p>'+String(e.message||e).replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))+'</p><p>Recarga la página para volver a intentarlo.</p></div>';
  }
})();
</script>
</body>
</html>
