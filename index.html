<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo MULTIMATERIALES</title>
</head>
<body>
<div style="font-family:Arial,sans-serif;padding:30px;text-align:center">Cargando catálogo MULTIMATERIALES…</div>
<script>
(async()=>{try{
  const r=await fetch('catalogo_payload.gz.b64?cb='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('No se pudo cargar el catálogo.');
  if(!('DecompressionStream' in window)) throw new Error('Este navegador no soporta la carga del catálogo.');

  // El archivo del repositorio es un GZIP binario, aunque conserve la extensión .b64.
  // Se debe leer como bytes, no como texto ni pasarlo por atob().
  const compressed=await r.arrayBuffer();
  const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();

  document.open();
  document.write(html);
  document.close();
}catch(e){
  console.error(e);
  document.body.innerHTML='<div style="font-family:Arial,sans-serif;max-width:700px;margin:60px auto;padding:24px"><h2>No se pudo cargar el catálogo</h2><p>'+String(e.message||e)+'</p><p>Recarga la página para intentarlo de nuevo.</p></div>';
}})();
</script>
</body>
</html>
